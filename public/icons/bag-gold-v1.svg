<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202227"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="bagGold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe886"/>
      <stop offset="0.4" stop-color="#f3c81e"/>
      <stop offset="0.72" stop-color="#c89400"/>
      <stop offset="1" stop-color="#8f6800"/>
    </linearGradient>
    <linearGradient id="bagTie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b32e"/>
      <stop offset="1" stop-color="#7a5a10"/>
    </linearGradient>
    <radialGradient id="bagShine" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Bolsa de plata en amarillo, centrada -->
  <g transform="translate(26,8) scale(4.6)">
    <!-- Cuello fruncido -->
    <path d="M36 34 C38 28 37 21 41 17 C43 14.5 46 13.5 50 13.5 C54 13.5 57 14.5 59 17 C63 21 62 28 64 34 Z"
          fill="url(#bagGold)" stroke="#5a4208" stroke-width="2" stroke-linejoin="round"/>
    <!-- Cuerpo de la bolsa -->
    <path d="M35 34 C27 42 15 54 15 68 C15 84 31 93 50 93 C69 93 85 84 85 68 C85 54 73 42 65 34 Z"
          fill="url(#bagGold)" stroke="#5a4208" stroke-width="2" stroke-linejoin="round"/>
    <!-- Brillo -->
    <ellipse cx="39" cy="57" rx="17" ry="23" fill="url(#bagShine)"/>
    <!-- Atadura -->
    <rect x="30" y="29.5" width="40" height="9.5" rx="4.75" fill="url(#bagTie)" stroke="#5a4208" stroke-width="1.6"/>
    <!-- Pliegue del cuello -->
    <path d="M41 24 Q50 20 59 24" fill="none" stroke="#c9a020" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Signo peso -->
    <text x="50" y="67" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, 'Segoe UI', sans-serif" font-size="37" font-weight="900"
          fill="#3a2c00">$</text>
  </g>
</svg>
