# ============================================
# Render Blueprint — Sala de Juegos Backend
# Docs: https://render.com/docs/blueprint-spec
# ============================================
# Conectar desde el dashboard de Render: New > Blueprint > seleccionar este repo.
# Las variables marcadas `sync: false` NO se guardan en el repo: se cargan a mano
# en el dashboard de Render (Environment) la primera vez.
# ============================================

services:
  - type: web
    name: sala-de-juegos-backend
    runtime: node
    plan: starter            # free = se duerme por inactividad; starter = siempre activo
    region: oregon           # opciones: oregon, ohio, virginia, frankfurt, singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Runtime ---
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # PORT lo inyecta Render automáticamente — no definir.

      # --- Secretos obligatorios (el server aborta si faltan) ---
      - key: JWT_SECRET
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false

      # --- CORS (recomendado en producción) ---
      - key: ALLOWED_ORIGINS
        sync: false          # ej: https://midominio.com,https://admin.midominio.com

      # --- Redis (opcional — sin esto Socket.IO corre en modo single-instance) ---
      - key: REDIS_URL
        sync: false

      # --- Firebase Cloud Messaging (opcional — push notifications) ---
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # --- Integración JUGAYGANA (opcional) ---
      - key: JG_API_URL
        sync: false

      # --- Admin inicial (opcional) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- AWS S3 (opcional — subida de archivos) ---
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
